# Default values for sonarr
# Converted to libchart pattern (nested under app-chart dependency)
# ----------------------------------------------------------------------------
# Global Configuration
# ----------------------------------------------------------------------------
global:
  name: sonarr
  namespace: media-center
  chart:
    appVersion: 4.0.16.2944
  labels:
    overrides:
      app.kubernetes.io/instance: sonarr


# ----------------------------------------------------------------------------
# Service Configuration
# ----------------------------------------------------------------------------
network:
  enabled: true
  services:
    enabled: true
    items:
      http:
        enabled: true
        type: ClusterIP
        ports:
          http:
            port: 8080
            targetPort: http
            protocol: TCP
        annotations:
          description: "Sonarr media center HTTP service"
      metrics:
        enabled: true
        type: ClusterIP
        ports:
          metrics:
            port: 9100
            targetPort: metrics
            protocol: TCP
        annotations:
          description: "Sonarr media center HTTP service"

  # ----------------------------------------------------------------------------
  # Feature: Networking (Gateway API & Security)
  # ----------------------------------------------------------------------------
  httpRoute:
    enabled: true
    port: 8080
    host: sonarr-k8s.orhayoun.com
    gateway:
      name: shared-platform-gateway
      namespace: istio-system
    routes:
      # Main Application Route (HTTPS)
      - name: route
        enabled: true
        listener:
          sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: sonarr-http
                port: 8080
                weight: 100
                group: ""
                kind: Service

      # HTTP Redirect Route
      - name: http-redirect
        enabled: true
        listener:
          sectionName: http
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
  networkPolicy:
    enabled: true
    items: 
      default:
        enabled: true
        policyTypes:
          - Ingress
          - Egress
        ingress:
          - from:
              # Gateway traffic (HTTP + HBONE for ambient mesh)
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: istio-system
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: shared-platform-gateway

              # Prometheus metrics scraping (metrics port + HBONE for ambient mesh)
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: prometheus
              
              # Home Assistant API access (HTTP + HBONE for ambient mesh)
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: homeassistant
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: home-assistant
            ports:
              - protocol: TCP
                port: 15008

        egress:
          # DNS access (required for service discovery and external lookups)
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53

          # PostgreSQL database access
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: postgresql
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: databases
            ports:
              - port: 5432
                protocol: TCP
                
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: download-clients
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: istio-system # TODO: Check if actually needed
            ports:
              - protocol: TCP
                port: 15008
          - to:
              - ipBlock:
                  cidr: "0.0.0.0/0"
                  except:
                    - "10.42.0.0/16"
                    - "10.43.0.0/16"
                    - "192.168.0.0/16"
            ports:
              - protocol: TCP
                port: 443
  istio:
    enabled: true
    authorizationPolicy:
      enabled: true
      items:
        # Ingress gateway access - allows traffic from the gateway to the service
        ingress:
          enabled: true
          action: ALLOW
          rules:
            - from:
                - source:
                    principals:
                      - "cluster.local/ns/istio-system/sa/shared-platform-gateway-istio"
              to:
                - operation:
                    ports: ["8080"]
        # Prometheus metrics scraping - allows Prometheus to scrape metrics
        prometheus:
          enabled: true
          action: ALLOW
          rules:
            - from:
                - source:
                    principals:
                      - "cluster.local/ns/monitoring/sa/prometheus-kube-prometheus-prometheus"
              to:
                - operation:
                    ports: ["9100"]
        # Home Assistant access (custom policy)
        homeassistant:
          enabled: true
          action: ALLOW
          rules:
            - from:
                - source:
                    principals:
                      - "cluster.local/ns/homeassistant/sa/homeassistant-home-assistant"
              to:
                - operation:
                    ports: ["8080"]
    # ----------------------------------------------------------------------------
    # Circuit Breaker Configuration
    # ----------------------------------------------------------------------------
    destinationrule:
      enabled: true
      host: sonarr-http
      trafficPolicy:
        connectionPool:
          tcp:
            maxConnections: 100
          http:
            http1MaxPendingRequests: 10
            http2MaxRequests: 100
            maxRequestsPerConnection: 2
        outlierDetection:
          consecutive5xxErrors: 5
          interval: 30s
          baseEjectionTime: 30s
          maxEjectionPercent: 50


# ----------------------------------------------------------------------------
# Deployment Configuration
# ----------------------------------------------------------------------------
deployment:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  terminationGracePeriodSeconds: 60
  dnsPolicy: ClusterFirst
  enableServiceLinks: false
  automountServiceAccountToken: false

  # Pod labels
  podLabels:
    app.kubernetes.io/component: media-manager
    app.kubernetes.io/part-of: media-center
    logging.kubernetes.io/component: media-center
    logging.kubernetes.io/service: sonarr

  # Node selector to ensure pods only schedule on Linux nodes
  nodeSelector:
    kubernetes.io/os: linux

  # Pod security context
  podSecurityContext:
    fsGroup: 1011
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    supplementalGroups:
      - 1010  # downloads group for NFS access
      - 1003  # media-nfs group for NFS access

  # Main container configuration
  # NOTE: Container name 'sonarr' matches dashboard queries (container="sonarr")
  # Application-v2 requires explicit container definitions (no defaults)
  containers:
    sonarr:
      enabled: true
      image:
        repository: ghcr.io/runlix/sonarr
        tag: "release-4.0.16.2944-latest@sha256:ec4ada4e4042f2226470c1875e503ee0137d589a3e3292d5d665a6e4276be8e2"
        pullPolicy: IfNotPresent

      env:
        - name: TZ
          value: "UTC"
        - name: SONARR__SERVER__PORT
          value: "8080"
        - name: SONARR__SERVER__BINDADDRESS
          value: "0.0.0.0"
      
      ports:
        - containerPort: 8080
          name: http
          protocol: TCP
      
      volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
        - name: media-old
          mountPath: /media-old
        - name: downloads
          mountPath: /downloads
        - name: backup
          mountPath: /backup
        - name: tmp
          mountPath: /tmp

      # Health Probes
      livenessProbe:
        httpGet:
          path: /ping
          port: http
          scheme: HTTP
        failureThreshold: 3
        initialDelaySeconds: 30
        periodSeconds: 30
        successThreshold: 1
        timeoutSeconds: 5

      readinessProbe:
        httpGet:
          path: /ping
          port: http
          scheme: HTTP
        failureThreshold: 3
        initialDelaySeconds: 15
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 5

      startupProbe:
        httpGet:
          path: /ping
          port: http
          scheme: HTTP
        failureThreshold: 30
        initialDelaySeconds: 10
        periodSeconds: 5
        successThreshold: 1
        timeoutSeconds: 5

      # Container Security Context (main container override)
      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1012  # Matches Sonarr PUID
        runAsGroup: 1011  # Matches Sonarr PGID
        allowPrivilegeEscalation: false
        privileged: false
        appArmorProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      # Resources
      resources:
        requests:
          cpu: 500m
          memory: 256Mi
          ephemeral-storage: 2Gi
        limits:
          cpu: 500m
          memory: 1Gi
          ephemeral-storage: 2Gi

    # Metrics exporter container (Exportarr)
    exportarr:
      enabled: true
      image:
        repository: ghcr.io/orhayoun/exportarr
        tag: "v2.3.1@sha256:2650f6a501b1d691daf5dfe758068f44336d0bb1d443f9db2c94900244d423bc"
        pullPolicy: IfNotPresent

      args:
        - "sonarr"

      env:
        - name: URL
          value: http://localhost:8080
        - name: CONFIG
          value: /config/config.xml
        - name: PORT
          value: "9100"
        - name: ENABLE_ADDITIONAL_METRICS
          value: "false"
        - name: ENABLE_UNKNOWN_QUEUE_ITEMS
          value: "false"

      ports:
        - containerPort: 9100
          name: metrics
          protocol: TCP

      volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true

      # Health Probes
      livenessProbe:
        httpGet:
          path: /metrics
          port: metrics
          scheme: HTTP
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
        successThreshold: 1

      readinessProbe:
        httpGet:
          path: /metrics
          port: metrics
          scheme: HTTP
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
        successThreshold: 1

      startupProbe:
        httpGet:
          path: /metrics
          port: metrics
          scheme: HTTP
        initialDelaySeconds: 45  # MONITORING: Allow time for Sonarr to be ready
        # Exporter depends on: (1) Sonarr config.xml file, (2) Sonarr service at localhost:8080
        # Sonarr startup probe allows up to 160s (10s + 30*5s), so 45s initial delay ensures Sonarr is likely ready
        periodSeconds: 10  # MONITORING: Check every 10s to reduce probe frequency during startup
        timeoutSeconds: 10  # MONITORING: Longer timeout allows exporter time to connect to Sonarr and respond
        # Exporter may be slow to respond while still connecting to Sonarr API or initializing metrics collection
        failureThreshold: 30  # MONITORING: Allow up to 5 minutes total startup time (45s + 30*10s = 345s)
        # Provides sufficient time for exporter to initialize, connect to Sonarr, and start serving metrics
        successThreshold: 1

      # Container Security Context
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534  # nobody user
        runAsGroup: 65534
        appArmorProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      # Resources
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
          ephemeral-storage: 100Mi
        limits:
          cpu: 100m
          memory: 64Mi
          ephemeral-storage: 100Mi

# ----------------------------------------------------------------------------
# Feature: Persistence
# ----------------------------------------------------------------------------
persistence:
  enabled: true
  claims:
    config:
      size: 1Gi
      storageClass: longhorn
      accessMode: ReadWriteOnce
      retain: true
  volumes:
    - name: config
      persistentVolumeClaim:
        claimName: sonarr-config
    - name: media
      nfs:
        server: snorlax.orhayoun.com
        path: /mnt/vol1/media-center/media/tv_shows
    - name: media-old
      nfs:
        server: snorlax.orhayoun.com
        path: /mnt/vol1/Media/videos/TV_Shows
    - name: downloads
      nfs:
        server: snorlax.orhayoun.com
        path: /mnt/vol1/media-center/downloads
    - name: backup
      nfs:
        server: snorlax.orhayoun.com
        path: /mnt/vol1/media-center/backup/sonarr
    - name: tmp
      emptyDir:
        sizeLimit: 1Gi

# ----------------------------------------------------------------------------
# Feature: Observability
# ----------------------------------------------------------------------------
metrics:
  enabled: true
  # ServiceMonitor Configuration
  serviceMonitor:
    enabled: true
    port: 9100
    interval: 10s  # ServiceMonitor scrape interval
    scrapeTimeout: 5s  # ServiceMonitor scrape timeout
    path: /metrics # Optional - Metrics endpoint path (e.g., "/metrics")
    honorLabels: false # Optional - Honor labels from target (boolean)
    selector:
      matchLabels:
        app.kubernetes.io/name: sonarr
        app.kubernetes.io/instance: sonarr
        app.kubernetes.io/component: service-metrics

    namespaceSelector:
      matchNames:
        - media-center

    relabelings:
      - action: replace
        sourceLabels:
          - __meta_kubernetes_namespace
        targetLabel: namespace
      - action: replace
        sourceLabels:
          - __meta_kubernetes_pod_name
        targetLabel: instance

    metricRelabelings:
      - action: replace
        replacement: sonarr
        targetLabel: service
      - action: replace
        replacement: media-center
        targetLabel: component
  # PrometheusRule Configuration
  prometheusRule:
    enabled: true
    rules:
      - alert: SonarrDown
        expr: sonarr_system_status{service="sonarr", component="media-center"} == 0
        for: 5m
        labels:
          severity: critical
          service: sonarr
          component: media-center
        annotations:
          summary: "Sonarr service is down"
          description: "Sonarr system status is 0 (unhealthy) for more than 5 minutes."
      - alert: SonarrCutoffUnmetHigh
        expr: sonarr_episode_cutoff_unmet_total{service="sonarr", component="media-center"} > 100
        for: 30m
        labels:
          severity: warning
          service: sonarr
          component: media-center
        annotations:
          summary: "Sonarr cutoff unmet backlog is high"
          description: "Sonarr has more than 100 cutoff-unmet episodes for more than 30 minutes (upgrade backlog)."
      - alert: SonarrMissingEpisodesHigh
        expr: sonarr_episode_missing_total{service="sonarr", component="media-center"} > 50
        for: 1h
        labels:
          severity: info
          service: sonarr
          component: media-center
        annotations:
          summary: "Sonarr has many missing episodes"
          description: "Sonarr has more than 50 missing episodes. This may indicate indexing or download issues."
      - alert: SonarrExportarrMetricsUnavailable
        expr: kube_deployment_status_replicas_available{deployment="sonarr", namespace="media-center"} > 0 and absent_over_time(sonarr_system_status{service="sonarr", component="media-center"}[5m])
        for: 5m
        labels:
          severity: warning
          service: sonarr
          component: media-center
          sidecar: exportarr
        annotations:
          summary: "Sonarr Exportarr metrics endpoint unavailable"
          description: "Sonarr pod is running but Exportarr metrics are missing for more than 5 minutes. Check Exportarr container logs in pod {{ $labels.pod }}."
      - alert: SonarrHealthIssuesPresent
        expr: sonarr_system_health_issues{service="sonarr", component="media-center"} > 0
        for: 15m
        labels:
          severity: warning
          service: sonarr
          component: media-center
        annotations:
          summary: "Sonarr reports health issues"
          description: "Sonarr is reporting one or more health issues for more than 15 minutes (count={{ $value }})."
      - alert: SonarrExporterScrapeSlow
        expr: max_over_time(sonarr_scrape_duration_seconds{service="sonarr", component="media-center"}[10m]) > 2
        for: 10m
        labels:
          severity: warning
          service: sonarr
          component: media-center
          sidecar: exportarr
        annotations:
          summary: "Sonarr exporter scrape is slow"
          description: "Sonarr Exportarr scrape duration exceeded 2s for more than 10 minutes (max={{ $value }}s)."
      # ============================================================================
      # Exporter Sidecar Alerts (Auto-generated when exporter enabled)
      # ============================================================================
      - alert: SonarrExporterNotReady
        expr: |
          kube_deployment_status_replicas_available{deployment="sonarr", namespace="media-center"} > 0
          and
          kube_pod_container_status_ready{container="exportarr", pod=~"sonarr-.*", namespace="media-center"} == 0
        for: 2m
        labels:
          severity: warning
          component: media-center
          service: sonarr
          sidecar: exportarr
        annotations:
          summary: "Sonarr exporter sidecar is not ready"
          description: "Exporter container in Sonarr pod {{ $labels.pod }} is not ready for more than 2 minutes."
      - alert: SonarrExporterRestarting
        expr: increase(kube_pod_container_status_restarts_total{namespace="media-center", pod=~"sonarr-.*", container="exportarr"}[1h]) > 2
        for: 0m
        labels:
          severity: warning
          component: media-center
          service: sonarr
          sidecar: exportarr
        annotations:
          summary: "Sonarr exporter sidecar restarting frequently"
          description: "Exporter sidecar container in Sonarr pod {{ $labels.pod }} has restarted more than 2 times in the last hour."
      - alert: SonarrHighCPUUtilization
        expr: |
          (
            sum(rate(container_cpu_usage_seconds_total{namespace="media-center", pod=~"sonarr-.*", container="sonarr"}[5m]))
            /
            sum(kube_pod_container_resource_requests{namespace="media-center", pod=~"sonarr-.*", container="sonarr", resource="cpu"})
          ) * 100 > 80
        for: 10m
        labels:
          severity: warning
          service: sonarr
          component: media-center
          resource: cpu
        annotations:
          summary: "Sonarr CPU utilization is high"
          description: "Sonarr CPU usage is above 80% of requested CPU for more than 10 minutes (value={{ $value }}%)."
      - alert: SonarrHighMemoryUtilization
        expr: |
          (
            max(container_memory_working_set_bytes{namespace="media-center", pod=~"sonarr-.*", container="sonarr"})
            /
            max(kube_pod_container_resource_limits{namespace="media-center", pod=~"sonarr-.*", container="sonarr", resource="memory"})
          ) * 100 > 85
        for: 10m
        labels:
          severity: warning
          service: sonarr
          component: media-center
          resource: memory
        annotations:
          summary: "Sonarr memory utilization is high"
          description: "Sonarr memory working set is above 85% of memory limit for more than 10 minutes (value={{ $value }}%)."
      - alert: SonarrAuthorizationPolicyDenials
        expr: sum(rate(istio_requests_total{destination_workload="sonarr", destination_workload_namespace="media-center", destination_service_name="sonarr", request_protocol="http", response_code="403", response_flags="SEC"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
          service: sonarr
          component: media-center
          security: authorization
        annotations:
          summary: "Sonarr authorization policy denials detected"
          description: "Sonarr is experiencing authorization policy denials. {{ $value }} requests/sec are being denied."
      - alert: SonarrHighAuthorizationDenialRate
        expr: |
          (
            sum(rate(istio_requests_total{destination_workload="sonarr", destination_workload_namespace="media-center", destination_service_name="sonarr", request_protocol="http", response_code="403", response_flags="SEC"}[5m]))
            /
            sum(rate(istio_requests_total{destination_workload="sonarr", destination_workload_namespace="media-center", destination_service_name="sonarr", request_protocol="http"}[5m]))
          ) * 100 > 5
        for: 5m
        labels:
          severity: critical
          service: sonarr
          component: media-center
          security: authorization
        annotations:
          summary: "Sonarr high authorization denial rate"
          description: "Sonarr has a high authorization denial rate ({{ $value }}% of requests denied). This may indicate a misconfigured authorization policy."
  # Grafana Configuration
  grafana:
    enabled: true
    dashboard:
      enabled: true
      items:
        sonarr-dashboard:
          enabled: true
          name: "application"
          allowCrossNamespaceImport: true
          file: "app.json"
          # Optional: Override instanceSelector for this specific dashboard
          # instanceSelector:
          #   matchLabels:
          #     dashboards: "specific-grafana"
          # Optional: Folder assignment
          # folder: "Application Dashboards"
          # folderUID: "app-dashboards-uid"
          # folderRef: "grafana-folder-resource"
# ----------------------------------------------------------------------------
# Service Account
# ----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: "sonarr"
  automount: false
  annotations:
    description: "Sonarr media center service account"

# ----------------------------------------------------------------------------
# Pod Disruption Budget
# ----------------------------------------------------------------------------
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
