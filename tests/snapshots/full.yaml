apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sonarr
  namespace: media-center
  labels:
    app.kubernetes.io/component: prometheus-rule
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/version: 4.0.16.2944
    helm.sh/chart: sonarr-0.0.9
spec:
  groups:
    - name: sonarr.rules
      rules:
        - alert: SonarrDown
          annotations:
            description: Sonarr system status is 0 (unhealthy) for more than 5 minutes.
            summary: Sonarr service is down
          expr: sonarr_system_status{service="sonarr", component="media-center"} == 0
          for: 5m
          labels:
            component: media-center
            service: sonarr
            severity: critical
        - alert: SonarrCutoffUnmetHigh
          annotations:
            description: Sonarr has more than 100 cutoff-unmet episodes for more than 30 minutes
              (upgrade backlog).
            summary: Sonarr cutoff unmet backlog is high
          expr: sonarr_episode_cutoff_unmet_total{service="sonarr", component="media-center"}
            > 100
          for: 30m
          labels:
            component: media-center
            service: sonarr
            severity: warning
        - alert: SonarrMissingEpisodesHigh
          annotations:
            description: Sonarr has more than 50 missing episodes. This may indicate indexing
              or download issues.
            summary: Sonarr has many missing episodes
          expr: sonarr_episode_missing_total{service="sonarr", component="media-center"} >
            50
          for: 1h
          labels:
            component: media-center
            service: sonarr
            severity: info
        - alert: SonarrExportarrMetricsUnavailable
          annotations:
            description: Sonarr pod is running but Exportarr metrics are missing for more
              than 5 minutes. Check Exportarr container logs in pod {{ $labels.pod }}.
            summary: Sonarr Exportarr metrics endpoint unavailable
          expr: kube_deployment_status_replicas_available{deployment="sonarr", namespace="media-center"}
            > 0 and absent_over_time(sonarr_system_status{service="sonarr", component="media-center"}[5m])
          for: 5m
          labels:
            component: media-center
            service: sonarr
            severity: warning
            sidecar: exportarr
        - alert: SonarrHealthIssuesPresent
          annotations:
            description: Sonarr is reporting one or more health issues for more than 15 minutes
              (count={{ $value }}).
            summary: Sonarr reports health issues
          expr: sonarr_system_health_issues{service="sonarr", component="media-center"} >
            0
          for: 15m
          labels:
            component: media-center
            service: sonarr
            severity: warning
        - alert: SonarrExporterScrapeSlow
          annotations:
            description: Sonarr Exportarr scrape duration exceeded 2s for more than 10 minutes
              (max={{ $value }}s).
            summary: Sonarr exporter scrape is slow
          expr: max_over_time(sonarr_scrape_duration_seconds{service="sonarr", component="media-center"}[10m])
            > 2
          for: 10m
          labels:
            component: media-center
            service: sonarr
            severity: warning
            sidecar: exportarr
        - alert: SonarrExporterNotReady
          annotations:
            description: Exporter container in Sonarr pod {{ $labels.pod }} is not ready for
              more than 2 minutes.
            summary: Sonarr exporter sidecar is not ready
          expr: |
            kube_deployment_status_replicas_available{deployment="sonarr", namespace="media-center"} > 0
            and
            kube_pod_container_status_ready{container="exportarr", pod=~"sonarr-.*", namespace="media-center"} == 0
          for: 2m
          labels:
            component: media-center
            service: sonarr
            severity: warning
            sidecar: exportarr
        - alert: SonarrExporterRestarting
          annotations:
            description: Exporter sidecar container in Sonarr pod {{ $labels.pod }} has restarted
              more than 2 times in the last hour.
            summary: Sonarr exporter sidecar restarting frequently
          expr: increase(kube_pod_container_status_restarts_total{namespace="media-center",
            pod=~"sonarr-.*", container="exportarr"}[1h]) > 2
          for: 0m
          labels:
            component: media-center
            service: sonarr
            severity: warning
            sidecar: exportarr
        - alert: SonarrHighCPUUtilization
          annotations:
            description: Sonarr CPU usage is above 80% of requested CPU for more than 10 minutes
              (value={{ $value }}%).
            summary: Sonarr CPU utilization is high
          expr: |
            (
              sum(rate(container_cpu_usage_seconds_total{namespace="media-center", pod=~"sonarr-.*", container="sonarr"}[5m]))
              /
              sum(kube_pod_container_resource_requests{namespace="media-center", pod=~"sonarr-.*", container="sonarr", resource="cpu"})
            ) * 100 > 80
          for: 10m
          labels:
            component: media-center
            resource: cpu
            service: sonarr
            severity: warning
        - alert: SonarrHighMemoryUtilization
          annotations:
            description: Sonarr memory working set is above 85% of memory limit for more than
              10 minutes (value={{ $value }}%).
            summary: Sonarr memory utilization is high
          expr: |
            (
              max(container_memory_working_set_bytes{namespace="media-center", pod=~"sonarr-.*", container="sonarr"})
              /
              max(kube_pod_container_resource_limits{namespace="media-center", pod=~"sonarr-.*", container="sonarr", resource="memory"})
            ) * 100 > 85
          for: 10m
          labels:
            component: media-center
            resource: memory
            service: sonarr
            severity: warning
        - alert: SonarrAuthorizationPolicyDenials
          annotations:
            description: Sonarr is experiencing authorization policy denials. {{ $value }}
              requests/sec are being denied.
            summary: Sonarr authorization policy denials detected
          expr: |
            sum(
              rate(istio_requests_total{
                destination_workload="sonarr",
                destination_workload_namespace="media-center",
                destination_service_name="sonarr",
                request_protocol="http",
                response_code="403",
                response_flags="SEC"
              }[5m])
            ) > 0
          for: 2m
          labels:
            component: media-center
            security: authorization
            service: sonarr
            severity: warning
        - alert: SonarrHighAuthorizationDenialRate
          annotations:
            description: Sonarr has a high authorization denial rate ({{ $value }}% of requests
              denied). This may indicate a misconfigured authorization policy.
            summary: Sonarr high authorization denial rate
          expr: |
            (
              sum(
                rate(istio_requests_total{
                  destination_workload="sonarr",
                  destination_workload_namespace="media-center",
                  destination_service_name="sonarr",
                  request_protocol="http",
                  response_code="403",
                  response_flags="SEC"
                }[5m])
              )
              /
              sum(rate(istio_requests_total{destination_workload="sonarr", destination_workload_namespace="media-center", destination_service_name="sonarr", request_protocol="http"}[5m]))
            ) * 100 > 5
          for: 5m
          labels:
            component: media-center
            security: authorization
            service: sonarr
            severity: critical
