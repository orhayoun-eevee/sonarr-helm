suite: sonarr chart contract
templates:
  - templates/all.yaml
tests:
  - it: renders expected default resource set and ingress host
    asserts:
      - hasDocuments:
          count: 15
      - documentSelector:
          path: metadata.name
          value: sonarr-route
        equal:
          path: spec.hostnames[0]
          value: sonarr-k8s.orhayoun.com
      - documentSelector:
          path: kind
          value: GrafanaDashboard
        equal:
          path: spec.instanceSelector.matchLabels["app.kubernetes.io/instance"]
          value: prometheus
      - documentSelector:
          path: kind
          value: GrafanaDashboard
        equal:
          path: spec.instanceSelector.matchLabels["app.kubernetes.io/name"]
          value: grafana
      - documentSelector:
          path: kind
          value: ServiceMonitor
        exists:
          path: metadata.name
      - documentSelector:
          path: kind
          value: DestinationRule
        equal:
          path: spec.host
          value: sonarr-http

  - it: wires sonarr application container security and pvc correctly
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[1].name
          value: sonarr
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[1].securityContext.readOnlyRootFilesystem
          value: true
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[1].securityContext.runAsUser
          value: 1012
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[1].securityContext.runAsGroup
          value: 1011
      - documentSelector:
          path: kind
          value: PersistentVolumeClaim
        equal:
          path: metadata.name
          value: sonarr-config

  - it: keeps minimal scenario render compact and deterministic
    values:
      - scenarios/minimal.yaml
    asserts:
      - hasDocuments:
          count: 5

  - it: disables destination rule when explicitly turned off
    set:
      network:
        istio:
          destinationRule:
            enabled: false
    asserts:
      - hasDocuments:
          count: 14

  - it: applies grafana instance selector overrides from values
    set:
      metrics:
        grafana:
          instanceSelector:
            matchLabels:
              app.kubernetes.io/instance: observability
              app.kubernetes.io/name: grafana-primary
    asserts:
      - documentSelector:
          path: kind
          value: GrafanaDashboard
        equal:
          path: spec.instanceSelector.matchLabels["app.kubernetes.io/instance"]
          value: observability
      - documentSelector:
          path: kind
          value: GrafanaDashboard
        equal:
          path: spec.instanceSelector.matchLabels["app.kubernetes.io/name"]
          value: grafana-primary

  - it: disables serviceMonitor when explicitly turned off
    set:
      metrics:
        serviceMonitor:
          enabled: false
    asserts:
      - hasDocuments:
          count: 14

  - it: applies httproute host override
    set:
      network:
        httpRoute:
          host: sonarr.example.internal
    asserts:
      - documentSelector:
          path: metadata.name
          value: sonarr-route
        equal:
          path: spec.hostnames[0]
          value: sonarr.example.internal

  - it: applies destination rule host override
    set:
      network:
        istio:
          destinationRule:
            host: sonarr-custom-http
    asserts:
      - documentSelector:
          path: kind
          value: DestinationRule
        equal:
          path: spec.host
          value: sonarr-custom-http

  - it: disables grafana dashboard resources when grafana is disabled
    set:
      metrics:
        grafana:
          enabled: false
    asserts:
      - hasDocuments:
          count: 14

  - it: applies explicit sonarr image override for controlled rollouts
    set:
      workload:
        spec:
          containers:
            sonarr:
              image:
                repository: registry.internal/sonarr
                tag: ci-test
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[1].image
          value: registry.internal/sonarr:ci-test

  - it: keeps sonarr networking and health probes wired to stable defaults
    asserts:
      - documentSelector:
          path: metadata.name
          value: sonarr-http
        equal:
          path: spec.ports[0].port
          value: 8080
      - documentSelector:
          path: metadata.name
          value: sonarr-metrics
        equal:
          path: spec.ports[0].targetPort
          value: metrics
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[1].livenessProbe.httpGet.path
          value: /ping
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[1].readinessProbe.httpGet.path
          value: /ping
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: sonarr-config
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[1].imagePullPolicy
          value: IfNotPresent
